<div class="item-detail" *ngIf="item">
  <h2>{{ item.name }}</h2>
  <img [src]="'https://ddragon.leagueoflegends.com/cdn/15.23.1/img/item/' + item.image.full" [alt]="item.name" />

  <p class="plaintext">{{ item.plaintext }}</p>

  <div class="description" [innerHTML]="item.description"></div>

  <p><strong>Precio:</strong> {{ item.gold.total }} oro</p>
  <p><strong>Se vende por:</strong> {{ item.gold.sell }} oro</p>
</div>
